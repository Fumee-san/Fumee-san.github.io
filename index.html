<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Cantik! 🎂✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Sacramento&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
      font-family: 'Poppins', sans-serif;
      padding: 15px;
      overflow-x: hidden;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 25px 20px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(255, 107, 129, 0.2);
      width: 100%;
      max-width: 380px;
      text-align: center;
      position: relative;
      animation: fadeIn 0.8s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .hidden { display: none !important; }
    
    h1 {
      color: #ff4757;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .subtitle {
      font-family: 'Sacramento', cursive;
      font-size: 26px;
      color: #ff6b81;
      margin-top: -5px;
      margin-bottom: 15px;
    }
    
    .slider-box {
      position: relative;
      width: 100%;
      height: 280px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      margin: 15px 0;
      background: #f1f2f6;
    }
    .slider-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      transition: opacity 0.5s ease-in-out;
    }
    .slider-box img.active {
      display: block;
    }
    .slide-count {
      position: absolute;
      bottom: 8px;
      right: 12px;
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .msg-box {
      background: #fff5f7;
      border: 1px dashed #ff80ab;
      border-radius: 15px;
      padding: 15px;
      min-height: 110px;
      text-align: left;
      font-size: 13.5px;
      color: #444;
      line-height: 1.6;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      background: linear-gradient(45deg, #ff4757, #ff6b81);
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
      transition: all 0.2s ease;
    }
    button:hover { transform: translateY(-2px); }
    button.secondary {
      background: linear-gradient(45deg, #70a1ff, #1e90ff);
      box-shadow: 0 4px 12px rgba(30, 144, 255, 0.3);
    }
  </style>
</head>
<body>

  <!-- Musik Shape of My Heart -->
  <audio id="bgm" loop preload="auto">
    <source src="https://files.catbox.moe/8u2y1l.mp3" type="audio/mpeg">
  </audio>

  <!-- Halaman Pembuka -->
  <div class="card" id="step1">
    <div style="font-size: 50px; margin-bottom: 10px;">💌</div>
    <h1>Ada Surat Rahasia!</h1>
    <p style="font-size: 14px; color: #666; margin-bottom: 20px;">Seseorang mengirimkan gift card & ucapan spesial hari ini khusus buat kamu. Tekan tombol di bawah ini ya!</p>
    <button onclick="startApp()">Buka Suratnya ✨</button>
  </div>

  <!-- Halaman Utama Ucapan -->
  <div class="card hidden" id="step2">
    <h1>Happy Birthday Cantik!!! 🎉</h1>
    <div class="subtitle">Shape of My Heart 🎵</div>

    <!-- Slider Foto Cosplay/Selfie -->
    <div class="slider-box">
      <!-- Foto disematkan secara otomatis -->
    </div>

    <!-- Ucapan Mengetik -->
    <div class="msg-box">
      <span id="typed-text"></span>
    </div>

    <div class="btn-group hidden" id="actionBtns">
      <button onclick="nextPhoto()">Foto Lainnya 📸</button>
      <button class="secondary" onclick="askTraktiran()">Minta Traktiran 🍕</button>
    </div>
  </div>

  <script>
    const music = document.getElementById('bgm');
    const fullText = "ciee yang ulang tahun hari inii, btw jangan lupa traktirannya yya? ahaha ngga 😜\n\nUntuk kamuuu semoga panjang umur, sehat selaluu, semoga jd anak yg sholeh/sholehah, dan bermanfaat buat orang lain, sekali lagi HAPPY BIRTHDAY! 🥳✨\n\nooo iyaa maaf yya klo cuma bisa ngasih gift card kaya gini:( semoga suka yaa hihi^_^";
    let textIdx = 0;

    function startApp() {
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');
      music.play().catch(e => console.log(e));
      confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
      typeWriter();
    }

    function typeWriter() {
      if (textIdx < fullText.length) {
        let char = fullText.charAt(textIdx);
        document.getElementById("typed-text").innerHTML += (char === '\n' ? '<br>' : char);
        textIdx++;
        setTimeout(typeWriter, 35);
      } else {
        document.getElementById('actionBtns').classList.remove('hidden');
      }
    }

    function askTraktiran() {
      confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
      alert("Asikkk! Ditunggu ya makan-makannya 😋🍴");
    }
  </script>
</body>
</html>
